name: Cypress Tests

on:
  push:
    branches: [ "winge2e_assessment" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # ✅ Add this
      - name: Debug ENV
        run: |
          echo "WING_URL = $WING_URL"
          echo "WING_USERNAME = $WING_USERNAME"
          echo "WING_PASSWORD exists? -> ${{ secrets.WING_PASSWORD != '' }}"
          echo "SUPABASE_URL = $SUPABASE_URL"
          echo "SUPABASE_KEY exists? -> ${{ secrets.SUPABASE_KEY != '' }}"

      - name: Run Cypress
        run: npx cypress run
        env:
          WING_URL: ${{ secrets.WING_URL }}
          WING_USERNAME: ${{ secrets.WING_USERNAME }}
          WING_PASSWORD: ${{ secrets.WING_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
